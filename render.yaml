services:
  - type: web
    name: thaychienmath
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Ban xem thu: database trong (goi free mat du lieu moi lan khoi dong lai) -> tu nap du lieu demo
      # (thaychien / hs6a..hs9c, mat khau 123456). Xoa dong nay khi dung that.
      - key: SEED_DEMO
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Nhap 2 key duoi day trong dashboard Render (Environment).
      # Lay tu file backend/.env cua ban. De trong neu chua dung tinh nang cham bai AI.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
